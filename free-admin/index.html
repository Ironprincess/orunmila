<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orunmila (Free) — Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #FDFBF7; color: #0E2B33; font-family: "DM Sans", Georgia, serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; font-size: 30px; margin-bottom: 6px; }
  .sub { color: #8A8378; font-size: 14px; margin-bottom: 24px; }
  h2 { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; font-size: 20px; margin: 0; color: #DD7F41; }
  .panel { background: #F4EEE6; border-radius: 12px; padding: 22px; margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 5px; color: #5C6B70; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #D8CFC0; border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff; }
  button { margin-top: 16px; background: #0E2B33; color: #fff; border: none; border-radius: 8px; padding: 11px 22px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  button:hover { background: #DD7F41; }
  button.small { margin-top: 0; padding: 8px 16px; font-size: 13px; }
  .msg { font-size: 13px; color: #DD7F41; font-weight: 500; margin-top: 10px; min-height: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 6px 8px; border-bottom: 2px solid #D8CFC0; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #5C6B70; }
  td { padding: 8px; border-bottom: 1px solid #E5DDD0; vertical-align: top; }
  .hidden { display: none !important; }
  .q-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .q-actions { display: flex; gap: 8px; }
  .q-list { max-height: 520px; overflow-y: auto; }
  .q-time { color: #8A8378; font-size: 11px; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Orunmila (Free) &middot; Questions</h1>
  <div class="sub">The student teaching assistant &mdash; what people are asking, anonymously.</div>

  <div class="panel" id="lockPanel">
    <label for="secret">Admin Secret</label>
    <input type="password" id="secret" placeholder="Paste the admin secret">
    <button id="unlockBtn">Unlock</button>
    <p class="msg" id="lockMsg"></p>
  </div>

  <div class="hidden" id="adminArea">
    <div class="panel">
      <div class="q-head">
        <h2>Questions Asked</h2>
        <div class="q-actions">
          <button class="small" id="refreshQ">Refresh</button>
          <button class="small" id="downloadQ">Download CSV</button>
        </div>
      </div>
      <p class="msg" id="qMsg" style="margin-top:0;">Anonymous &mdash; question text only. Newest first.</p>
      <div class="q-list">
        <table>
          <thead><tr><th style="width:150px;">When</th><th>Question</th></tr></thead>
          <tbody id="qRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
var secret = "";
function $(id) { return document.getElementById(id); }
function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

function loadQuestions() {
  $("qRows").innerHTML = '<tr><td colspan="2" style="color:#8A8378;">Loading...</td></tr>';
  fetch("/api/free-log?limit=500", { headers: { "x-admin-secret": secret } })
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.error) {
        var m = data.error === "Unauthorized" ? "Wrong secret." : data.error;
        $("lockMsg").textContent = m;
        $("qRows").innerHTML = '<tr><td colspan="2" style="color:#B0442A;">' + esc(m) + '</td></tr>';
        return;
      }
      $("lockPanel").classList.add("hidden");
      $("adminArea").classList.remove("hidden");
      var items = data.items || [];
      if (!items.length) { $("qRows").innerHTML = '<tr><td colspan="2" style="color:#8A8378;">No questions logged yet.</td></tr>'; return; }
      var html = "";
      items.forEach(function(it) {
        var whenText = "";
        if (it.ts) { var d = new Date(it.ts); whenText = d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
        html += "<tr><td class='q-time'>" + esc(whenText) + "</td><td>" + esc(it.q || "") + "</td></tr>";
      });
      $("qRows").innerHTML = html;
      $("qMsg").textContent = data.count + " questions (showing newest first).";
    })
    .catch(function(){ $("lockMsg").textContent = "Could not reach the server. Try again."; });
}

function downloadCSV() {
  fetch("/api/free-log?format=csv&limit=2000", { headers: { "x-admin-secret": secret } })
    .then(function(r){ return r.text(); })
    .then(function(csv) {
      var blob = new Blob([csv], { type: "text/csv" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "orunmila-free-questions.csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
}

$("unlockBtn").onclick = function() { secret = $("secret").value.trim(); if (secret) loadQuestions(); };
$("secret").addEventListener("keydown", function(e){ if (e.key === "Enter") $("unlockBtn").click(); });
$("refreshQ").onclick = loadQuestions;
$("downloadQ").onclick = downloadCSV;
</script>
</body>
</html>
